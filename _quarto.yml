project:
  type: website
  output-dir: _site
  resources:
    - investigations/**/data/**
    - investigations/**/scripts/**
    - investigations/**/sources.yml

website:
  title: "A Dangerous Thing"
  description: "Transparent investigations built from public data."
  site-url: https://paul-j-hamilton.github.io/public-data-investigations
  open-graph: true
  page-navigation: true
  navbar:
    left:
      - href: index.qmd
        text: Investigations
      - href: philosophy.qmd
        text: Philosophy
    right:
      - icon: github
        href: https://github.com/paul-j-hamilton/public-data-investigations
        aria-label: Source repository
  page-footer:
    left: "Reporting and analysis are published with sources, code, and revision history."
    right:
      - text: "Source code"
        href: https://github.com/paul-j-hamilton/public-data-investigations

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    code-fold: true
    code-summary: "Show code"
    code-copy: true
    anchor-sections: true
    link-external-newwindow: true
    # Fills ```{.python include="..." snippet="..."}``` blocks from the real scripts.
    filters:
      - _filters/include-code.lua

execute:
  freeze: auto
